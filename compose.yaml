services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshop-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant_data:/qdrant/storage
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop-local-only}@db:5432/${POSTGRES_DB:-workshop}
      SESSION_MINUTES: ${SESSION_MINUTES:-60}
      QDRANT_URL: http://qdrant:6333
      QDRANT_CARDS_COLLECTION: ${QDRANT_CARDS_COLLECTION:-cards}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
  card-updater:
    build: ./backend
    command: ["python", "-m", "app.catalog_update", "--daily"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_CARDS_COLLECTION: ${QDRANT_CARDS_COLLECTION:-cards}
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  qdrant_data:
